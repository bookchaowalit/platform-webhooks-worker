name = "solo-empire-hooks"
main = "src/worker.ts"
compatibility_date = "2026-10-04"
# @sentry/cloudflare needs AsyncLocalStorage.
compatibility_flags = ["nodejs_als"]
workers_dev = true

# The account comes from CLOUDFLARE_ACCOUNT_ID (Infisical /cloudflare), the account that owns the
# bookchaowalit.com zone. Custom domain approved by the owner on 2026-10-23 (owner action checklist).
routes = [
  { pattern = "hooks.bookchaowalit.com", custom_domain = true }
]

# Raw signed events land here first (bronze layer).
# The bucket must exist before deploy: wrangler r2 bucket create solo-empire-hooks
[[r2_buckets]]
binding = "HOOKS_BUCKET"
bucket_name = "solo-empire-hooks"

# ADR-0008 queue plane. Created once with:
#   wrangler queues create hooks-inbound && wrangler queues create hooks-inbound-dlq
[[queues.producers]]
binding = "HOOKS_QUEUE"
queue = "hooks-inbound"

# Bound only to read the DLQ backlog for /healthz.
[[queues.producers]]
binding = "HOOKS_DLQ"
queue = "hooks-inbound-dlq"

[[queues.consumers]]
queue = "hooks-inbound"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "hooks-inbound-dlq"

# Worker secrets are never stored in this file; set them with `wrangler secret put`:
#   STRIPE_WEBHOOK_SECRET  required, Stripe endpoint signing secret
#   FORWARD_URL            optional, receiver for ADR-0008 envelopes (data = minimal event summary)
#   FORWARD_TOKEN          optional, bearer credential for FORWARD_URL
#   SENTRY_DSN             optional, error reporting (unset = off; errors only, see src/sentry.ts)
